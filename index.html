<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="PPTist - 在线演示文稿（幻灯片）应用，还原了大部分 Office PowerPoint 常用功能，实现在线PPT的编辑、演示，支持导出PPT文件，支持AI生成PPT。" />
    <meta name="keywords" content="pptist,ppt,powerpoint,office powerpoint,在线ppt,幻灯片,演示文稿,ppt在线制作,aippt" />
    <title>PPTist - 在线演示文稿</title>

    <script>
      const coursewareParams = new URLSearchParams(location.search)
      document.documentElement.dataset.coursewareEntry = window.parent === window && !coursewareParams.has('embed')
        ? 'standalone' : coursewareParams.get('embed') === 'play' ? 'play' : 'edit'
      document.oncontextmenu = event => event.preventDefault()
    </script>
    <!-- Keep these styles available before the app bundle loads. -->
    <style>
      .courseware-loading-overlay {
        position: fixed;
        z-index: 10000;
        inset: 0;
        display: grid;
        place-items: center;
        cursor: wait;
      }
      .courseware-loading-overlay--page { background: #f2f2f3; }
      html[data-courseware-entry="edit"] .courseware-loading-overlay--page { top: 65px; }
      html[data-courseware-entry="standalone"] .courseware-startup-embedded,
      html:not([data-courseware-entry="standalone"]) .courseware-startup-standalone { display: none; }
      .courseware-loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      }
      .courseware-loading-title {
        margin: 13px 0 12px;
        color: #303133;
        font-size: 19px;
      }
      .courseware-loading-overlay--page .courseware-loading-title { color: #000; }
      .courseware-loading-tip { white-space: nowrap; }
      .courseware-loading-spinner {
        width: 41px;
        height: 41px;
        border: 3px solid #0091ff;
        border-right-color: #dff1ff;
        border-radius: 50%;
        box-sizing: border-box;
        animation: courseware-spin .8s linear infinite;
      }
      @keyframes courseware-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <!-- Vue dismisses this status when the first content or error has rendered. -->
    <div id="courseware-startup-loading" class="courseware-loading-overlay courseware-loading-overlay--page" role="status" aria-live="polite">
      <div class="courseware-loading-content">
        <span class="courseware-loading-spinner" aria-hidden="true"></span>
        <strong class="courseware-loading-title courseware-loading-tip courseware-startup-embedded">正在连接管理端并加载课件…</strong>
        <strong class="courseware-loading-title courseware-loading-tip courseware-startup-standalone">正在加载课件…</strong>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
